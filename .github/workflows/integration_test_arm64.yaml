name: Integration tests arm64

on:
    pull_request:
        branches:
            - main
            - track/*

jobs:
    integration-tests-arm64:
        uses: canonical/operator-workflows/.github/workflows/integration_test.yaml@030c5b20a0bb880dcf1ed326bff0fc16b6eb6ac1 # main as of 2026-10-09
        permissions:
            contents: read
        secrets: inherit
        with:
            working-directory: maas-region
            provider: lxd
            juju-channel: 3.6/stable
            with-uv: true
            charmcraft-channel: latest/stable
            python-version: "3.14"
            self-hosted-runner: true
            self-hosted-runner-arch: arm64
            self-hosted-runner-label: self-hosted-linux-arm64-noble-large
            builder-runner-label: self-hosted-linux-arm64-noble-medium
            extra-arguments: -x --model-arch=arm64
