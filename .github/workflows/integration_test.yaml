name: Integration tests

on:
  pull_request:
    branches:
      - main
      - track/*

jobs:
  integration-tests:
    uses: canonical/operator-workflows/.github/workflows/integration_test.yaml@1305365b01750a3ab472fd285ec6e1902b5377bb # main as of 2026-10-16
    permissions:
      contents: read
    secrets: inherit
    with:
      working-directory: maas-region
      provider: lxd
      juju-channel: 3.6/stable
      with-uv: true
      charmcraft-channel: latest/stable
      python-version: "3.14"
      self-hosted-runner: true
      self-hosted-runner-arch: x64
      self-hosted-runner-label: self-hosted-linux-amd64-noble-large
      builder-runner-label: self-hosted-linux-amd64-noble-medium
