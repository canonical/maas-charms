name: Auto-update Charm Libraries

on:
  # Manual trigger
  workflow_dispatch:
  # Check the upstream once per day
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-lib-region:
    name: Check libraries
    uses: canonical/operator-workflows/.github/workflows/auto_update_charm_libs.yaml@030c5b20a0bb880dcf1ed326bff0fc16b6eb6ac1 # main as of 2026-10-09
    permissions:
      id-token: write
      pull-requests: write
      contents: write
    secrets: inherit
    with:
      working-directory: maas-region
