name: Auto-update Charm Libraries

on:
  # Manual trigger
  workflow_dispatch:
  # Check regularly the upstream every four hours
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"

jobs:
  update-lib-region:
    name: Check libraries
    uses: canonical/operator-workflows/.github/workflows/auto_update_charm_libs.yaml@1305365b01750a3ab472fd285ec6e1902b5377bb # main as of 2026-10-16
    permissions:
      id-token: write
      pull-requests: write
      contents: write
    secrets: inherit
    with:
      working-directory: maas-region
