name: Release Charms to Edge and Publish Libraries

on:
  push:
    branches:
      - main
      - track/*
    paths:
      - maas-region/**

jobs:
  release-region:
    name: Release MAAS Region charm to edge
    uses: canonical/operator-workflows/.github/workflows/publish_charm.yaml@1305365b01750a3ab472fd285ec6e1902b5377bb # main as of 2026-10-16
    permissions:
      contents: write
      actions: read
    secrets: inherit
    with:
      working-directory: maas-region
      tag-prefix: maas-region
