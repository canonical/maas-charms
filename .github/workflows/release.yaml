name: Release Charms to Edge and Publish Libraries

on:
  push:
    branches:
      - main
      - track/*
    paths:
      - maas-region/**

jobs:
  release-region:
    name: Release MAAS Region charm to edge
    uses: canonical/operator-workflows/.github/workflows/publish_charm.yaml@030c5b20a0bb880dcf1ed326bff0fc16b6eb6ac1 # main as of 2026-10-09
    permissions:
      contents: write
      actions: read
    secrets: inherit
    with:
      working-directory: maas-region
      tag-prefix: maas-region
