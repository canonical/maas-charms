name: Tests

on:
  pull_request:
    branches:
      - main
      - track/*

jobs:
  quality-checks:
    uses: canonical/operator-workflows/.github/workflows/test.yaml@030c5b20a0bb880dcf1ed326bff0fc16b6eb6ac1 # main as of 2026-10-09
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
    with:
      working-directory: maas-region
      with-uv: true
      require-check-lib: false
      python-version: "3.14"
