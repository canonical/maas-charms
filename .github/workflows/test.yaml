name: Tests

on:
  pull_request:
    branches:
      - main
      - track/*

jobs:
  quality-checks:
    uses: canonical/operator-workflows/.github/workflows/test.yaml@1305365b01750a3ab472fd285ec6e1902b5377bb # main as of 2026-10-16
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
    with:
      working-directory: maas-region
      with-uv: true
      require-check-lib: false
      python-version: "3.14"
