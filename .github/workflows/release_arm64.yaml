name: Release Charms to Edge and Publish Libraries arm64

on:
  push:
    branches:
      - main
      - track/*
    paths:
      - maas-region/**

jobs:
  release-region-arm64:
    name: Release MAAS Region charm to edge arm64
    uses: canonical/operator-workflows/.github/workflows/publish_charm.yaml@030c5b20a0bb880dcf1ed326bff0fc16b6eb6ac1 # main as of 2026-10-09
    permissions:
      contents: write
      actions: read
    secrets: inherit
    with:
      working-directory: maas-region
      tag-prefix: maas-region
      integration-test-workflow-file: "integration_test_arm64.yaml"
