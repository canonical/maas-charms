name: Release Charms to Edge and Publish Libraries arm64

on:
  push:
    branches:
      - main
      - track/*
    paths:
      - maas-region/**

jobs:
  release-region-arm64:
    name: Release MAAS Region charm to edge arm64
    uses: canonical/operator-workflows/.github/workflows/publish_charm.yaml@1305365b01750a3ab472fd285ec6e1902b5377bb # main as of 2026-10-16
    permissions:
      contents: write
      actions: read
    secrets: inherit
    with:
      working-directory: maas-region
      tag-prefix: maas-region
      integration-test-workflow-file: "integration_test_arm64.yaml"
